<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, lightblue, lightpink);
        }
        .form-container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px gray;
        }
        h2 {
            text-align: center;
            color: darkblue;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: darkgreen;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid darkgray;
        }
        input[type="radio"], input[type="checkbox"] {
            width: auto;
        }
        .btn {
            background: lightgreen;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: darkblue;
        }
        .btn:hover {
            background: skyblue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form action="submit.php" method="post" autocomplete="on">
            
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fullname" placeholder="Enter your name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required minlength="6">
            
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
            
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
            
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Choose--</option>
                <option value="B.Tech">B.Tech</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
            </select>
            
            <label>Skills:</label>
                <input type="checkbox" name="skills" value="HTML"> HTML
                <input type="checkbox" name="skills" value="CSS"> CSS
                <input type="checkbox" name="skills" value="JavaScript"> JavaScript
                <input type="checkbox" name="skills" value="Python"> Python
                <input type="checkbox" name="skills" value="C++"> C++
                <input type="checkbox" name="skills" value="Java"> Java
                <input type="checkbox" name="skills" value="SQL"> SQL

            
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
            
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            
            <label>
                <input type="checkbox" name="terms" required> I agree to the Terms & Conditions
            </label>
            
            <input type="submit" class="btn" value="Register">
            <input type="reset" class="btn" value="Reset">
        </form>
    </div>
</body>
</html>
