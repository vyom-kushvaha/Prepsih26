<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="main">
        <div class="left-main">
            <p id="logo-name">Smart India Hackathon</p>
            <p id="description">our first Hackathon so we gives our best. we show what we are and what we want ! Just give your best.</p>
        </div>
        <div class="right-main">
            <div id="login-div">
                <div id="logo-login">Member Login</div>
                <p id="welcome">Let's see your dashboard !</p>
                <input type="text" class="form-field" id="username" placeholder="username">
                <input type="text" class="form-field" id="password" placeholder="password">
                <button class="form-field" id="submit">Submit</button>
                <a href="login.html" id="forget">Forget Your Password ?</a>
                <div class="form-field" id="google">
                    <img src="google.png" alt="Google">
                  <p>Login with Google</p>
                </div
>
                
            </div>
        </div>
    </div>
</body>
</html>
