<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashPro Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      background: #111827;
      color: white;
      padding: 25px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 40px;
      padding-left: 10px;
    }

    .nav-item {
      display: block;
      text-decoration: none;
      color: #9ca3af;
      padding: 13px;
      margin-bottom: 6px;
      border-radius: 8px;
      font-size: 14px;
    }

    .nav-item.active {
      background: #4f46e5;
      color: white;
    }

    .nav-item:hover {
      background: #1f2937;
      color: white;
    }

    .main {
      margin-left: 250px;
      padding: 35px;
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
       DashPro
    </div>

    <a href="#" class="nav-item active"> Dashboard</a>
    <a href="#" class="nav-item"> Customers</a>
    <a href="#" class="nav-item"> Orders</a>
    <a href="#" class="nav-item"> Analytics</a>
    <a href="#" class="nav-item"> Settings</a>
    <a href="#" class="nav-item"> Help Center</a>

  </aside>

  <main class="main">

    <h1>Dashboard</h1>
    <p>Welcome to your dashboard.</p>

  </main>

</body>
</html>
